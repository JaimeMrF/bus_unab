# Cabeceras de seguridad comunes (incluir en cada server/location que use add_header,
# porque nginx no hereda add_header si el location define las suyas).
add_header X-Frame-Options           "SAMEORIGIN"                          always;
add_header X-Content-Type-Options    "nosniff"                             always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                        always;
add_header X-Permitted-Cross-Domain-Policies "none"                        always;
