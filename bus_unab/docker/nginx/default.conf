# ── HTTP server ───────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    # Usar el DNS interno de Docker para resolución lazy del upstream.
    # Evita el error "host not found in upstream app:9000" al arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header X-XSS-Protection       "1; mode=block"                   always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass              $upstream;
        fastcgi_index             index.php;
        fastcgi_param             SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                   fastcgi_params;
        fastcgi_read_timeout      300;
        fastcgi_buffer_size       64k;
        fastcgi_buffers           4 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_param             HTTP_X_FORWARDED_PROTO $scheme;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}

