[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; VPS 4GB: 5 workers × ~60 MB real = ~300 MB max
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

request_terminate_timeout = 300s

catch_workers_output    = yes
decorate_workers_output = no
clear_env               = no
