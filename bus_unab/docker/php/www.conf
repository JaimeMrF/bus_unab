[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Dinámica: ajustar pm.max_children según RAM disponible en VPS
; Regla: (RAM libre en MB) / 30 MB por proceso
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests      = 500

request_terminate_timeout = 300s

catch_workers_output    = yes
decorate_workers_output = no
clear_env               = no
